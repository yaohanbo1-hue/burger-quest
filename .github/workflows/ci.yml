name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # fetch-depth: 2 —— 空白检查需要父提交（默认浅克隆没有 HEAD~）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check (compileall)
        run: python -m compileall -q burger_quest tests tools

      # 覆盖率门禁 85%（pyproject [tool.coverage.report] fail_under 同值）：
      # 2026-10-17 基线 90%；阈值只升不降，降覆盖需单独提交并说明理由
      - name: Run tests (with coverage gate)
        run: python -m pytest -q --cov=burger_quest --cov-report=term-missing --cov-fail-under=85

      - name: Packaging sanity (demo data ships with the wheel)
        run: |
          pip install build -q
          python -m build --wheel -o dist_check
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("dist_check/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          assert "burger_quest/data/demo_data.json" in names, "演示数据未打进 wheel"
          print("wheel 包含演示数据 OK:", whl.split("/")[-1])
          PY

      # 空白检查口径 = 上一个提交的 diff。本地同款命令：
      #   git diff --check HEAD~（或直接跑 python tools/prepush_check.py）
      # 注意：本地提交前跑 git diff --check（未暂存改动）查不出提交自带的
      # 空白问题——2026-10-17 曾因此 CI 红而本地全绿（da31963）。
      - name: Whitespace check
        run: git diff --check HEAD~

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Secret scan (no token / real config committed)
        run: |
          python - <<'PY'
          import re, pathlib
          # 1) 不得出现真实形态的 Bearer Token（占位符除外）
          pat = re.compile(r"Bearer\s+(?!\$\{)([A-Za-z0-9_\-]{16,})")
          hits = []
          for p in pathlib.Path(".").rglob("*.py"):
              if any(x in p.parts for x in (".git", "dist_check", "__pycache__")):
                  continue
              for m in pat.finditer(p.read_text(encoding="utf-8", errors="ignore")):
                  v = m.group(1)
                  if any(w in v.lower() for w in ("fake", "test", "example", "placeholder")):
                      continue
                  hits.append((str(p), v[:6]))
          assert not hits, f"疑似硬编码 Token: {hits}"
          # 2) 示例配置只含占位符
          cfg = pathlib.Path("mcp-config.example.json").read_text(encoding="utf-8")
          assert "${MCD_MCP_TOKEN}" in cfg
          # 3) CONTEST_DECLARATION.md 必须存在且非空（参赛必交）
          decl = pathlib.Path("CONTEST_DECLARATION.md")
          assert decl.exists() and decl.stat().st_size > 100
          print("secret scan OK：无硬编码 Token，示例配置仅占位符，参赛声明在位")
          PY

      - name: Skill docs consistency
        run: python -m pytest tests/test_skill_docs.py -q

      # 类型检查（2026-10-17 从 45 error 清到 0；SDK 缺桩按 pyproject
      # [tool.mypy] ignore_missing_imports 处理，burger_quest 自身零容忍）
      - name: Type check (mypy, zero errors)
        run: mypy burger_quest

      # 安全静态扫描（2026-10-17 从 12 findings 清到 0；B324 哈希已加
      # usedforsecurity=False，B110 改 contextlib.suppress，余下两处
      # nosec 均带理由）。任何新 finding 直接红。
      - name: Security scan (bandit, zero findings)
        run: bandit -r burger_quest

      # 依赖漏洞扫描（OSV 库；失败=存在已知漏洞的传递依赖）
      - name: Dependency audit (pip-audit)
        run: pip-audit --progress-spinner off

      - name: Offline demos still reproducible
        run: |
          python -m burger_quest demo "我想吃辣，预算35，外送到南山科技园，一个人" >/dev/null
          python -m burger_quest demo "预算5块，想吃汉堡" >/dev/null || true   # 失败场景：退出码 1 属预期
          python -m burger_quest smoke --demo >/dev/null
          echo "offline demos OK"

  # Windows 原生验证（Linux CI 不能代替 Windows 测试：PowerShell 脚本语法/BOM/
  # 控制台编码/.env 路径语义都只在 Windows 上真实存在）
  windows:
    name: Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check (compileall)
        run: python -m compileall -q burger_quest tests tools

      - name: Run tests
        run: python -m pytest -q

      # PowerShell 脚本：解析器语法检查（PS 5.1 语义）+ BOM/编码头/安全不变量（跨平台测试已覆盖，这里验证真实解析）
      - name: PowerShell scripts parse (PS 5.1 parser)
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $errors = $null; $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$($f.Name) 语法错误: $($errors[0].Message)" }
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { throw "$($f.Name) 缺 UTF-8 BOM（PS 5.1 会按 ANSI 解析中文导致语法错误）" }
            Write-Host "OK $($f.Name)"
          }

      # Windows 上跑 setup 脚本的「无 Token」路径（管道喂 3=跳过配置）：幂等 + 不回退 Demo
      - name: setup-windows.ps1 no-token path (piped)
        shell: pwsh
        run: |
          "3" | powershell -ExecutionPolicy Bypass -File scripts/setup-windows.ps1
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Output "::error::setup 脚本无 Token 路径失败: $code"
            exit 1
          }
          Write-Output "setup 无 Token 路径 OK"
          exit 0

      # Windows 上真实诊断的缺 Token 路径：必须 exit 2 且不回退 Demo
      # （显式捕获退出码并 exit 0/1，避免 pwsh 包装层对 $LASTEXITCODE 的语义歧义）
      - name: doctor without token fails with exit 2 (no demo fallback)
        shell: pwsh
        run: |
          $env:MCD_MCP_TOKEN = $null
          python -m burger_quest doctor
          $code = $LASTEXITCODE
          if ($code -ne 2) {
            Write-Output "::error::doctor 缺 Token 时应退出 2（配置类错误），实际: $code"
            exit 1
          }
          Write-Output "doctor 缺 Token 正确退出 2（明确失败，不回退 Demo）"
          exit 0

      # Windows 上 CLI 入口与离线演示（.venv 由上一步 setup 创建）
      - name: CLI entry and offline demo on Windows
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m burger_quest --version
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::CLI 入口失败"; exit 1 }
          .\.venv\Scripts\python.exe -m burger_quest demo "我想吃辣，预算35" | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Output "::error::Windows 离线演示失败: $code"
            exit 1
          }
          Write-Host "Windows offline demo OK"
          exit 0
