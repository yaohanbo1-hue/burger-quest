[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burger-quest"
version = "0.1.0"
description = "Burger Quest · 麦门异世界 —— 基于麦当劳中国官方 MCP Server 的游戏化点餐规划 Skill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "mcdonalds", "burger-quest", "ai-agent", "game", "skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
# 运行时依赖：引擎核心（解析/规划/文案/卡片）零第三方依赖；
# 仅真实 MCP 模式需要官方 mcp SDK（Streamable HTTP 客户端）。
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
# 测试依赖（CI 与本地开发）：pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
burger-quest = "burger_quest.cli:main"

[project.urls]
Homepage = "https://github.com/yaohanbo1-hue/burger-quest"
Repository = "https://github.com/yaohanbo1-hue/burger-quest"
Issues = "https://github.com/yaohanbo1-hue/burger-quest/issues"

[tool.setuptools.packages.find]
include = ["burger_quest*"]

# 演示数据随包分发：pip install 后 demo 模式仍可离线运行
[tool.setuptools.package-data]
burger_quest = ["data/*.json", "web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 覆盖率门禁：CI 与本地同一把尺（--cov-fail-under 见 CI 的 Run tests 步骤）。
# 当前基线 90%（2026-10-17：webui 端到端测试从 28% 拉到 65% 后）；
# 阈值刻意留 5 个百分点缓冲，防止无关紧要的增减让 CI 假红——
# 降覆盖要先过「为什么值得降」这一问，阈值只升不降（提门禁=单独提交）。
[tool.coverage.run]
source = ["burger_quest"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

# 类型检查口径（CI 与本地共用）：官方 mcp SDK 的类型桩不完整，
# 缺失导入按 Any 处理而非报错——这是「渐进类型化」的务实起点，
# 不是关掉类型检查（burger_quest 自身 20 个文件必须零 error）。
[tool.mypy]
ignore_missing_imports = true
