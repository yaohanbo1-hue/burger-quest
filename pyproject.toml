[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burger-quest"
version = "0.1.0"
description = "Burger Quest · 麦门异世界 —— 基于麦当劳中国官方 MCP Server 的游戏化点餐规划 Skill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
burger-quest = "burger_quest.cli:main"

[tool.setuptools.packages.find]
include = ["burger_quest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
